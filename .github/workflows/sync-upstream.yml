# Fork-only: keep this fork up to date with EuleMitKeule/pycatlink while
# preserving the email-login commits. Merges upstream weekly (no force push).
# On a merge conflict or failure, sends a Telegram alert.
name: Sync upstream

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/EuleMitKeule/pycatlink.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git merge --no-edit upstream/master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master
      - name: Telegram — atualização feita
        if: steps.merge.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode chat_id="${CHAT}" \
            --data-urlencode text="🐱 CatLink: o fork jcalheir/pycatlink foi atualizado com novidades do autor original. Atualização disponível no Marketplace do HA dentro de ~48 h."
      - name: Telegram — falhou
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode chat_id="${CHAT}" \
            --data-urlencode text="⚠️ CatLink: não consegui juntar as novidades do autor original ao fork jcalheir/pycatlink (conflito ou erro). Pede ao Claude para resolver: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
